<article><header><h1>Mol-Projector</h1><div class="post-meta"><span class="cdm-item">2026-06-04</span><a class="cdm-item cdm-link-item" href="https://ruswhy.top/tags/projects/">#projects</a><a class="cdm-item cdm-link-item" href="https://ruswhy.top/tags/python/">#python</a></div></header>

<section class="post-content"><p>一个 Python 工具，把三维分子结构（如 XYZ、ARC、SDF 等格式）自动转换成二维 MOL 格式。核心功能是根据原子坐标自动推断化学键类型（单键、双键、三键），无需手动指定。</p>
<p>支持命令行批量处理和 Python API 两种用法，另有分子碎片分解子命令。MIT 协议开源。</p>
</section></article>
