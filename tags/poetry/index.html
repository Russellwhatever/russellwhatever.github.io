<main><h1 class="category-title">#poetry</h1><ul class="post-list"><li class="post-entry"><div class="post-header"><a class="post-title" href="https://ruswhy.top/blog/2026-03-du-shi/">26-03: 三月，我主要读诗</a><span class="post-date">2026-04-10</span></div><div class="post-description"><p>本月乏善可陈，懵懵懂懂看了一些书和电影。</p>
<h1 id="shou-xian-shi-shu">首先是书</h1>
<p>三月份，觅了个周末和朋友去杭州待了两天。民宿里，餐桌旁的架子上摆着一本木心的诗集，充数。那天晚上，敲过朋友的门，等她开门之前，我就取着，靠在餐桌上随便地翻他的诗。只记得诗集里随意的东西多，连住进城市，买了面包都简单地写下来。还略显无趣地写了一首关于颜色代表性格的诗…</div></li></ul></main>
